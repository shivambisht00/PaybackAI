<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayBack AI | Complete Payment Recovery</title>
  <meta name="theme-color" content="#0A0B10">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .retry-card {
      background: var(--bg-surface);
      border: 1px solid var(--cyan);
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.18);
      margin-top: 40px;
    }
    .payment-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.95rem;
    }
    .timer-badge {
      background: rgba(255, 184, 0, 0.12);
      color: var(--gold);
      border: 1px solid rgba(255, 184, 0, 0.3);
      padding: 6px 16px;
      border-radius: 20px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="retry-card" id="retry-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="/" class="logo" style="justify-content: center; margin-bottom: 8px;">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#0A0B10"/>
          <path d="M8 16L14 22L24 10" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        PayBack <span>AI</span>
      </a>
      <p style="color: var(--text-muted); font-size: 0.9rem;" id="portal-title">Secure Payment Recovery Portal</p>
    </div>

    <div id="portal-status-container">
      <div style="text-align: center; color: var(--text-muted); padding: 32px;">Validating secure retry token...</div>
    </div>
  </div>

  <script src="retry.js"></script>
</body>
</html>
