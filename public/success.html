<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful - PayBack AI</title>
    <style>
        body { font-family: sans-serif; background: #0A0B10; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #12141C; padding: 40px; border-radius: 12px; text-align: center; border: 1px solid #1E2230; max-width: 400px; }
        h1 { color: #00F0FF; margin-bottom: 10px; }
        p { color: #94A3B8; line-height: 1.5; }
        .btn { display: inline-block; margin-top: 20px; background: #00F0FF; color: #000; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Payment Successful! 🎉</h1>
        <p>Thank you! Your payment has been securely processed and your account status is fully restored. You can now close this window.</p>
        
        <!-- Yahan humne button ko change kar diya hai taaki wo dashboard par na le jaye -->
        <a href="javascript:window.close();" class="btn">Close Window</a>
    </div>
</body>
</html>
